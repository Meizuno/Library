name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  #  TESTS — behavior verification
  # ─────────────────────────────────────────────────────────────
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run pytest (warnings are errors)
        run: pytest -W error

  # ─────────────────────────────────────────────────────────────
  #  CODE QUALITY — static analysis & spelling
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Code quality (ruff + mypy + codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check library tests
      - name: Mypy
        run: mypy library tests
      - name: Codespell
        run: codespell --skip="*.lock,.git,__pycache__,.venv,*.egg-info"

  # ─────────────────────────────────────────────────────────────
  #  SECURITY — dependencies + licenses (code-level security is in ruff's S rules)
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit + license audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: pip-audit (CVE in dependencies)
        run: pip-audit --skip-editable
      - name: License audit (no GPL family)
        run: pip-licenses --fail-on="GPL;LGPL;AGPL"

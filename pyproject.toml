[project]
name = "library"
version = "0.1.0"
description = "Library management system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic[email]>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.49",
    "redis>=7.4.0",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "fakeredis>=2.35.1",
    "pylint>=3.3.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "codespell>=2.3.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "redefined-outer-name",  # pytest fixtures inherently look like shadowing
    "unused-argument",       # pytest side-effect fixtures (e.g. member_repo_with_member) look unused
    "duplicate-code",        # repeated test invocation patterns are intentional for clarity
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# fakeredis ships type stubs marked partial; aiosqlite has none.
module = ["fakeredis.*", "aiosqlite.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are end-to-end-validated by pytest; static type-check focuses on
# real correctness signals (union-attr, no-any-return, attr-defined) and
# skips the "every function needs -> None" noise that strict mode forces.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
